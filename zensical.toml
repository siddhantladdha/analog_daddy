[project]
site_name = "Analog Daddy"
site_url = "https://siddhantladdha.github.io/analog_daddy/"
repo_url = "https://github.com/siddhantladdha/analog_daddy"
repo_name = "siddhantladdha/analog_daddy"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
